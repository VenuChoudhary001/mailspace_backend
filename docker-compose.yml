services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mailspace-backend:latest
    container_name: mailspace-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Match graceful_shutdown_timeout in app/core/config.py so in-flight
    # requests can finish before the container is killed.
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
